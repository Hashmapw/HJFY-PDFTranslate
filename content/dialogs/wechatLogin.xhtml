<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="utf-8"/>
	<title>微信扫码登录</title>
	<style>
		body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; padding: 14px 16px; }
		h2 { margin: 0 0 4px; font-size: 16px; }
		.dim { color: #888; font-size: 12px; margin: 2px 0 8px; }
		#wxframe { width: 100%; height: 360px; border: 1px solid #ddd; border-radius: 4px; }
		.status { margin-top: 8px; font-size: 12px; color: #666; min-height: 16px; }
		.btns { margin-top: 10px; text-align: right; }
		.ok { color: #2e7d32; font-weight: bold; }
	</style>
</head>
<body>
	<h2>微信扫码登录</h2>
	<div class="dim">使用微信「扫一扫」扫描下方二维码，并在手机上点击「确认登录」。</div>
	<iframe id="wxframe"></iframe>
	<div class="status" id="wx-status">二维码加载中...</div>
	<div class="btns"><button id="wx-close">关闭</button></div>

	<script>
		(function () {
			var args = window.arguments && window.arguments[0] ? window.arguments[0] : {};
			var REDIR = encodeURIComponent("https://hjfy.top/api/login/callback/wechat?path=%2F");
			// self_redirect=true: 授权成功后跳转保持在 iframe 内, 不把本窗口导航走
			var QR_URL =
				"https://open.weixin.qq.com/connect/qrconnect?appid=wxd7885e86e52192fe&scope=snsapi_login" +
				"&redirect_uri=" + REDIR + "&state=HJFYZT&login_type=jssdk&self_redirect=true";
			var frame = document.getElementById("wxframe");
			var statusEl = document.getElementById("wx-status");
			frame.src = QR_URL;

			var start = Date.now();
			var pre = readSessionCookie();
			var notified = false;

			function readSessionCookie() {
				try {
					var cm = Services.cookies.getCookiesFromHost("hjfy.top", {});
					while (cm.hasMoreElements()) {
						var c = cm.getNext().QueryInterface(Ci.nsICookie);
						if (c.name === "session") return c.value;
					}
				} catch (e) {}
				return null;
			}

			function finish(sessionValue) {
				if (notified) return;
				notified = true;
				statusEl.textContent = "登录成功！";
				statusEl.classList.add("ok");
				try {
					if (args.onSuccess) args.onSuccess(sessionValue);
				} catch (e) {}
				setTimeout(function () { window.close(); }, 700);
			}

			var timer = setInterval(function () {
				var s = readSessionCookie();
				if (s && (!pre || s !== pre)) {
					clearInterval(timer);
					finish(s);
					return;
				}
				var elapsed = Math.round((Date.now() - start) / 1000);
				if (elapsed > 10 * 60) {
					clearInterval(timer);
					statusEl.textContent = "二维码可能已过期，请关闭后重试。";
				} else if (elapsed >= 90 && elapsed % 30 < 2) {
					statusEl.textContent = "请用微信扫码并在手机上确认…（" + Math.round(elapsed / 60) + " 分钟）";
				}
			}, 800);

			// iframe 发生跳转(含回到回调页)时也刷新一次状态
			frame.addEventListener("load", function () {
				setTimeout(function () {
					var s = readSessionCookie();
					if (s && (!pre || s !== pre)) {
						clearInterval(timer);
						finish(s);
					}
				}, 800);
			});

			document.getElementById("wx-close").addEventListener("click", function () {
				window.close();
			});
		})();
	</script>
</body>
</html>
