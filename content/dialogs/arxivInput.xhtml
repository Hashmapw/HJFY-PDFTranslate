<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="utf-8"/>
	<title>HJFY-PDFTranslate：获取翻译 PDF</title>
	<style>
		body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; line-height: 1.7; padding: 18px 22px; }
		h2 { margin: 0 0 4px; font-size: 16px; }
		.dim { color: #888; font-size: 12px; margin: 2px 0 12px; }
		label { display: block; margin: 10px 0 4px; font-weight: 600; }
		input[type="text"] { width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 13px; }
		.btns { margin-top: 14px; }
		button { padding: 6px 14px; font-size: 13px; margin-right: 8px; cursor: pointer; }
		.warn { background: #fff8e1; border: 1px solid #ffe082; padding: 6px 10px; border-radius: 3px; margin: 8px 0; font-size: 12px; }
	</style>
</head>
<body>
	<h2>获取翻译 PDF</h2>
	<div class="dim" id="item-title"></div>
	<div class="warn">本条目的「网址」字段中没有检测到 arXiv 链接。</div>

	<label for="arxiv-input">方式一：输入 arXiv 链接或 ID</label>
	<input type="text" id="arxiv-input" placeholder="https://arxiv.org/abs/2506.17310 或 2506.17310"/>

	<div class="btns">
		<button id="btn-arxiv">按此链接获取</button>
		<button id="btn-upload">上传条目 PDF 翻译</button>
		<button id="btn-cancel">取消</button>
	</div>

	<script>
		(function () {
			var args = window.arguments && window.arguments[0] ? window.arguments[0] : {};
			var titleEl = document.getElementById("item-title");
			if (titleEl && args.itemTitle) titleEl.textContent = "条目：" + args.itemTitle;
			var input = document.getElementById("arxiv-input");

			function done(choice) {
				try { if (args.done) args.done(choice); } catch (e) {}
				window.close();
			}

			document.getElementById("btn-arxiv").addEventListener("click", function () {
				done({ mode: "arxiv", text: input.value.trim() });
			});
			document.getElementById("btn-upload").addEventListener("click", function () {
				done({ mode: "upload" });
			});
			document.getElementById("btn-cancel").addEventListener("click", function () {
				done({ mode: "cancel" });
			});
			input.addEventListener("keydown", function (e) {
				if (e.key === "Enter") done({ mode: "arxiv", text: input.value.trim() });
				if (e.key === "Escape") done({ mode: "cancel" });
			});
			setTimeout(function () { input.focus(); }, 100);
		})();
	</script>
</body>
</html>
