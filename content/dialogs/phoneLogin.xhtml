<?xml version="1.0" encoding="UTF-8"?>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	xmlns:html="http://www.w3.org/1999/xhtml"
	id="hjfy-phone-login-window"
	title="手机号登录"
	windowtype="hjfy:phone-login"
	orient="vertical">
	<html:style><![CDATA[
		#hjfy-phone-login-window {
			min-width: 390px;
			min-height: 200px;
			background: Canvas;
			color: CanvasText;
		}
		#hjfy-phone-dialog {
			box-sizing: border-box;
			display: flex;
			flex-direction: column;
			min-height: 100%;
			padding: 16px 18px 14px;
			font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
		}
		#hjfy-phone-dialog-title {
			margin: 0 0 12px;
			font-size: 17px;
		}
		#hjfy-phone-dialog-form {
			display: grid;
			grid-template-columns: minmax(0, 1fr) max-content;
			gap: 9px 8px;
		}
		#hjfy-phone-dialog-form input {
			box-sizing: border-box;
			min-width: 0;
			height: 32px;
			padding: 5px 8px;
			font: inherit;
		}
		#hjfy-phone-dialog button {
			min-height: 32px;
			padding: 4px 12px;
			font: inherit;
		}
		#hjfy-phone-dialog-status {
			min-height: 18px;
			margin-top: 7px;
			color: GrayText;
			font-size: 12px;
		}
		#hjfy-phone-dialog-footer {
			display: flex;
			justify-content: flex-end;
			margin-top: 5px;
		}
	]]></html:style>
	<html:div id="hjfy-phone-dialog">
		<html:h1 id="hjfy-phone-dialog-title">手机号登录</html:h1>
		<html:div id="hjfy-phone-dialog-form">
			<html:input id="hjfy-phone-dialog-phone" type="tel" maxlength="11" placeholder="11 位手机号"/>
			<html:button id="hjfy-phone-dialog-send" type="button">发送验证码</html:button>
			<html:input id="hjfy-phone-dialog-code" type="text" maxlength="6" placeholder="短信验证码"/>
			<html:button id="hjfy-phone-dialog-login" type="button">登录</html:button>
		</html:div>
		<html:div id="hjfy-phone-dialog-status" role="status"></html:div>
		<html:div id="hjfy-phone-dialog-footer">
			<html:button id="hjfy-phone-dialog-close" type="button">取消</html:button>
		</html:div>
	</html:div>
</window>
