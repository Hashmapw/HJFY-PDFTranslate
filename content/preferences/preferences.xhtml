<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	xmlns:html="http://www.w3.org/1999/xhtml"
	class="main-section"
	id="hjfy-main"
	flex="1"
	onload="Zotero.HJFY.setupPrefs(window)">
	<html:style><![CDATA[
		#hjfy-main { box-sizing: border-box; width: 100%; max-width: 680px; min-width: 0; padding: 4px 0 28px; font: 13px/1.55 sans-serif; }
		.hjfy-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
		.hjfy-brand { font-size: 19px; font-weight: 700; }
		.hjfy-status { flex: none; padding: 3px 9px; border-radius: 999px; background: rgba(127,127,127,.12); color: GrayText; font-size: 12px; font-weight: 600; }
		.hjfy-status[data-state="success"] { background: rgba(30,126,71,.12); color: #18733c; }
		.hjfy-status[data-state="error"] { background: rgba(190,42,42,.11); color: #ad2525; }
		.hjfy-block { padding: 17px 0 20px; border-top: 1px solid rgba(127,127,127,.25); }
		.hjfy-title { margin: 0 0 15px; font-weight: 700; font-size: 14px; }
		.hjfy-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
		.hjfy-label { display: inline-block; width: 58px; }
		.hjfy-method { margin: 20px 0 10px; font-weight: 600; }
		.hjfy-input { box-sizing: border-box; width: 300px; max-width: 100%; height: 31px; padding: 5px 8px; font: inherit; }
		.hjfy-code { width: 300px; }
		#hjfy-main button { min-height: 31px; padding: 4px 12px; font: inherit; }
		.hjfy-primary { font-weight: 600; }
		.hjfy-small { min-height: 18px; color: GrayText; font-size: 12px; }
		.hjfy-advanced { margin-top: 20px; color: GrayText; font-weight: 600; }
		#hjfy-main [hidden] { display: none !important; }
		#hjfy-session-input { box-sizing: border-box; width: 100%; min-height: 70px; margin: 11px 0 8px; padding: 8px; font-family: monospace; }
		.hjfy-check { display: flex; align-items: center; gap: 8px; min-height: 31px; }
		.hjfy-check input { margin: 0; }
	]]></html:style>

	<html:div class="hjfy-header">
		<html:div class="hjfy-brand">HJFY PDF 翻译</html:div>
		<html:div class="hjfy-status" id="hjfy-status" data-state="idle">检测中...</html:div>
	</html:div>

	<html:div class="hjfy-block">
		<html:div class="hjfy-title">账号</html:div>
		<html:div class="hjfy-row">
			<html:button class="hjfy-primary" id="hjfy-wechat-login">微信扫码登录</html:button>
		</html:div>
		<html:div class="hjfy-method">手机号登录</html:div>
		<html:div class="hjfy-row">
			<html:label class="hjfy-label" for="hjfy-phone">手机号</html:label>
			<html:input class="hjfy-input" type="tel" id="hjfy-phone" placeholder="11 位手机号"/>
			<html:button id="hjfy-send-code">发送验证码</html:button>
		</html:div>
		<html:div class="hjfy-row">
			<html:label class="hjfy-label" for="hjfy-phone-code">验证码</html:label>
			<html:input class="hjfy-input hjfy-code" type="text" id="hjfy-phone-code" placeholder="短信验证码" maxlength="6"/>
			<html:button class="hjfy-primary" id="hjfy-phone-login">登录</html:button>
			<html:span class="hjfy-small" id="hjfy-send-status"></html:span>
		</html:div>

		<html:div class="hjfy-advanced" id="hjfy-advanced-toggle">高级登录</html:div>
		<html:div id="hjfy-advanced-body" hidden="true">
			<html:textarea id="hjfy-session-input" aria-label="HJFY 会话" placeholder="session=..."></html:textarea>
			<html:div class="hjfy-row">
				<html:button id="hjfy-save">保存会话</html:button>
				<html:button id="hjfy-verify">验证</html:button>
				<html:button id="hjfy-openlogin">打开网站</html:button>
				<html:button id="hjfy-clear">清除会话</html:button>
			</html:div>
		</html:div>

		<html:div class="hjfy-row" id="hjfy-logout-row">
			<html:button id="hjfy-logout">退出登录</html:button>
		</html:div>
	</html:div>

	<html:div class="hjfy-block">
		<html:div class="hjfy-title">下载</html:div>
		<html:label class="hjfy-check" for="hjfy-clean-pdf">
			<html:input type="checkbox" id="hjfy-clean-pdf"/>
			<html:span>生成纯净 PDF</html:span>
		</html:label>
	</html:div>
</vbox>
