<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	xmlns:html="http://www.w3.org/1999/xhtml"
	class="main-section"
	id="hjfy-main"
	flex="1"
	onload="Zotero.HJFY.setupPrefs(window)">
	<html:header class="hjfy-header">
		<html:div class="hjfy-brand">HJFY PDF 翻译</html:div>
		<html:div class="hjfy-status" id="hjfy-status" data-state="idle" role="status">检测中...</html:div>
	</html:header>

	<html:section class="hjfy-section" aria-labelledby="hjfy-account-title">
		<html:h2 class="hjfy-section-title" id="hjfy-account-title">账号</html:h2>

		<html:div class="hjfy-actions">
			<html:button class="hjfy-primary" id="hjfy-wechat-login">微信扫码登录</html:button>
		</html:div>

		<html:div class="hjfy-method-label">手机号登录</html:div>
		<html:div class="hjfy-phone-form">
			<html:label for="hjfy-phone">手机号</html:label>
			<html:input type="tel" id="hjfy-phone" autocomplete="tel" placeholder="11 位手机号"/>
			<html:button id="hjfy-send-code">发送验证码</html:button>

			<html:label for="hjfy-phone-code">验证码</html:label>
			<html:input type="text" id="hjfy-phone-code" inputmode="numeric" autocomplete="one-time-code" placeholder="短信验证码" maxlength="6"/>
			<html:button class="hjfy-primary" id="hjfy-phone-login">登录</html:button>
			<html:div class="hjfy-inline-status" id="hjfy-send-status" role="status"></html:div>
		</html:div>

		<html:details class="hjfy-advanced">
			<html:summary>高级登录</html:summary>
			<html:textarea id="hjfy-session-input" aria-label="HJFY 会话" placeholder="session=..."></html:textarea>
			<html:div class="hjfy-actions hjfy-actions-wrap">
				<html:button id="hjfy-save">保存会话</html:button>
				<html:button id="hjfy-verify">验证</html:button>
				<html:button id="hjfy-openlogin">打开网站</html:button>
				<html:button id="hjfy-clear">清除会话</html:button>
			</html:div>
		</html:details>

		<html:div class="hjfy-account-footer">
			<html:button id="hjfy-logout">退出登录</html:button>
		</html:div>
	</html:section>

	<html:section class="hjfy-section" aria-labelledby="hjfy-download-title">
		<html:h2 class="hjfy-section-title" id="hjfy-download-title">下载</html:h2>
		<html:label class="hjfy-check-row" for="hjfy-clean-pdf">
			<html:input type="checkbox" id="hjfy-clean-pdf"/>
			<html:span>生成纯净 PDF</html:span>
		</html:label>
	</html:section>
</vbox>
